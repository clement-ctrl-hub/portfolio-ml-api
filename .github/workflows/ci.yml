name: CI FastAPI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lancer les tests unitaires avec couverture
        run: |
          python -m pytest \
          -v \
          -m "not integration" \
          --cov=app \
          --cov-report=term-missing \
          --cov-fail-under=70

  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: tests

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer les identifiants AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Se connecter à Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construire l'image Docker
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .

      - name: Publier l'image Docker
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
  deploy-ec2:
    runs-on: ubuntu-latest
    needs: docker-build-and-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configurer les identifiants AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Déployer l'image sur EC2 avec SSM
        id: deploy
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          AWS_ACCOUNT_ID: "521855441310"
        run: |
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy portfolio ML API" \
            --parameters commands="[
              \"set -e\",
              \"aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}\",
              \"docker pull ${IMAGE_URI}\",
              \"echo Image téléchargée avec succès\" 
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          DEPLOYMENT_STATUS="Pending"

          for attempt in $(seq 1 60); do
            DEPLOYMENT_STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Tentative $attempt/60 - statut SSM : $DEPLOYMENT_STATUS"

            case "$DEPLOYMENT_STATUS" in
              Success)
                echo "Déploiement terminé avec succès."
                break
                ;;

              Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated)
                echo "Le déploiement SSM a échoué : $DEPLOYMENT_STATUS"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{
                    Status:Status,
                    StatusDetails:StatusDetails,
                    Output:StandardOutputContent,
                    Errors:StandardErrorContent
                  }'

                exit 1
                ;;

              *)
                sleep 5
                ;;
            esac
          done

          if [ "$DEPLOYMENT_STATUS" != "Success" ]; then
            echo "Le déploiement n'est pas terminé après 5 minutes."

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query '{
                Status:Status,
                StatusDetails:StatusDetails,
                Output:StandardOutputContent,
                Errors:StandardErrorContent
              }'

            exit 1
          fi

      - name: Afficher le résultat du déploiement
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{
              Status:Status,
              Output:StandardOutputContent,
              Errors:StandardErrorContent
            }'
  integration-tests:
    runs-on: ubuntu-latest
    needs: deploy-ec2

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances de test
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest httpx

      - name: Lancer les tests d'intégration
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          python -m pytest tests/test_integration.py -v -m integration                  